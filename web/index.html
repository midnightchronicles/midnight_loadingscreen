<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="origin-when-cross-origin" />
  <meta name="theme-color" content="#0e0c0a" />
  <title>Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background" id="background">
    <div class="bg-layer bg-layer-a active ken-burns" id="bg-layer-a"></div>
    <div class="bg-layer bg-layer-b ken-burns" id="bg-layer-b"></div>
    <div class="background-overlay"></div>
  </div>

  <header class="stats-bar" id="stats-bar" aria-label="Server status" aria-busy="true" aria-describedby="stats-live-region">
    <div class="stats-glance">
      <div class="stats-item stats-item-primary" data-stat="players">
        <span class="stats-label" id="stat-label-players">Online</span>
        <span class="stats-value-wrap"><span class="stats-value stats-pending" id="stat-players" aria-labelledby="stat-label-players" aria-busy="true">…</span></span>
      </div>
      <div class="stats-item stats-item-primary" data-stat="connecting">
        <span class="stats-label" id="stat-label-connecting">Connecting</span>
        <span class="stats-value-wrap"><span class="stats-value stats-pending" id="stat-connecting" aria-labelledby="stat-label-connecting" aria-busy="true">…</span></span>
      </div>
    </div>
    <div class="stats-jobs" id="stats-jobs" aria-label="Active jobs">
      <div class="stats-item stats-item-compact" data-stat="police">
        <span class="stats-label" id="stat-label-police">Police</span>
        <span class="stats-value-wrap"><span class="stats-value stats-pending" id="stat-police" aria-labelledby="stat-label-police" aria-busy="true">—</span></span>
      </div>
      <div class="stats-item stats-item-compact" data-stat="ems">
        <span class="stats-label" id="stat-label-ems">EMS</span>
        <span class="stats-value-wrap"><span class="stats-value stats-pending" id="stat-ems" aria-labelledby="stat-label-ems" aria-busy="true">—</span></span>
      </div>
      <div class="stats-item stats-item-compact" data-stat="mechanic">
        <span class="stats-label" id="stat-label-mechanic">Mechanic</span>
        <span class="stats-value-wrap"><span class="stats-value stats-pending" id="stat-mechanic" aria-labelledby="stat-label-mechanic" aria-busy="true">—</span></span>
      </div>
      <div class="stats-item stats-item-compact" data-stat="staff">
        <span class="stats-label" id="stat-label-staff">Staff</span>
        <span class="stats-value-wrap"><span class="stats-value stats-pending" id="stat-staff" aria-labelledby="stat-label-staff" aria-busy="true">—</span></span>
      </div>
    </div>
    <p class="stats-scanning" id="stats-scanning">Scanning job counts…</p>
    <p class="sr-only" id="stats-live-region" aria-live="polite" aria-atomic="true">Scanning who's already in the city.</p>
  </header>

  <aside class="staff-panel" id="staff-panel">
    <nav class="panel-tabs" role="tablist" aria-label="Panel sections">
      <button type="button" class="panel-tab active" id="tab-team" role="tab" data-tab="team" aria-selected="true" aria-controls="panel-team">Staff team</button>
      <button type="button" class="panel-tab" id="tab-rules" role="tab" data-tab="rules" aria-selected="false" aria-controls="panel-rules" tabindex="-1">
        Rules
        <span class="panel-tab-badge hidden" id="tab-rules-badge">New</span>
      </button>
      <button type="button" class="panel-tab" id="tab-updates" role="tab" data-tab="updates" aria-selected="false" aria-controls="panel-updates" tabindex="-1">Updates</button>
    </nav>

    <div class="panel-views">
      <div class="panel-view panel-scroll active" id="panel-team" role="tabpanel" data-panel="team" aria-labelledby="tab-team" tabindex="0">
        <div class="owner-list" id="owner-list"></div>
        <div class="staff-divider" id="staff-divider">
          <span>Staff</span>
        </div>
        <div class="staff-list" id="staff-list"></div>
      </div>

      <div class="panel-view panel-scroll" id="panel-rules" role="tabpanel" data-panel="rules" aria-labelledby="tab-rules" tabindex="-1" hidden>
        <div class="info-list" id="rules-list"></div>
      </div>

      <div class="panel-view panel-scroll" id="panel-updates" role="tabpanel" data-panel="updates" aria-labelledby="tab-updates" tabindex="-1" hidden>
        <div class="version-banner hidden" id="updates-version-banner"></div>
        <div class="info-list" id="updates-list"></div>
      </div>
    </div>
  </aside>

  <div class="video-panel" id="video-panel">
    <div class="media-shell">
      <div class="video-container" id="media-container">
        <div id="media-player"></div>
        <div class="video-fallback hidden" id="video-fallback">
          <p>This track couldn't load.</p>
        </div>
      </div>

      <div class="video-controls">
        <div class="media-head">
          <div class="audio-visual" id="audio-visual">
            <div class="audio-artwork" aria-hidden="true">
              <div class="audio-bars">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </div>

          <div class="media-copy">
            <div class="media-title-row">
              <div class="audio-label" id="audio-label">Loading track</div>
              <span class="video-counter" id="video-counter" aria-live="polite">1 / 1</span>
            </div>
            <p class="audio-hint hidden" id="audio-hint" role="status" aria-live="polite">Press play when you're ready for music</p>
          </div>
        </div>

        <div class="transport-row">
          <button type="button" class="control-btn control-btn-ghost" id="btn-prev" aria-label="Previous track" title="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button type="button" class="control-btn control-btn-primary control-btn-play" id="btn-play" aria-label="Play or pause" title="Play / Pause">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button type="button" class="control-btn control-btn-ghost" id="btn-next" aria-label="Next track" title="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <p class="shortcut-hint hidden" id="shortcut-hint">Click player, then Space · ← → · M</p>

        <div class="volume-row">
          <button type="button" class="control-btn control-btn-volume" id="btn-mute" title="Mute / Unmute" aria-label="Mute or unmute">
            <svg class="icon-volume" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg class="icon-muted hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <div class="volume-slider-wrap">
            <input
              type="range"
              class="volume-slider"
              id="volume-slider"
              min="0"
              max="100"
              value="70"
              aria-label="Volume"
            />
          </div>
          <span class="volume-value" id="volume-value">70%</span>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-brand">
      <h1 class="server-name" id="server-name"></h1>
      <p class="progress-status" id="progress-status">Convincing dispatch you're not a cop...</p>
    </div>
    <div class="progress-wrapper">
      <div
        class="progress-track"
        id="progress-bar"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-label="Connection progress"
      >
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-percent" id="progress-percent" aria-hidden="true">0%</span>
    </div>
  </footer>

  <script src="config.js" onerror="document.getElementById('progress-status').textContent='The loadscreen config failed to load. Ask staff to fix config.js.';"></script>
  <script src="script.js" onerror="document.getElementById('progress-status').textContent='The loadscreen script failed to load. Ask staff to restart the resource.';"></script>
</body>
</html>
